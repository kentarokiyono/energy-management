name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.base_ref }} && node tests/build-check.js origin/${{ github.base_ref }}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:long
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/
